name: Release package

on:
    push:
        branches:
            - main
        paths:
            - 'CHANGELOG.md'
    workflow_dispatch:

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: yarn workspaces focus

            - name: Build package
              run: yarn build

            - name: Create .npmrc
              run: |
                  echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
                  echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
                  echo "@miksrv:registry=https://npm.pkg.github.com/" >> ~/.npmrc

            - name: Create Release and Publish to npm
              id: changesets
              # v2 is required with Changesets CLI 3: it detects published packages through the
              # CHANGESETS_OUTPUT file written by `changeset publish`. v1 parsed the CLI's "New tag:"
              # log lines, which CLI 3 no longer prints, so it silently skipped tags and GitHub releases.
              uses: changesets/action@v2
              with:
                  publish-script: yarn release
                  github-token: ${{ secrets.GITHUB_TOKEN }}
              env:
                  # Publishing now goes through `yarn npm publish` (Yarn Berry), which never
                  # reads .npmrc (project- or user-wide) - auth must come from Yarn's own
                  # config, read here from its env-var form of `npmAuthToken`.
                  YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
